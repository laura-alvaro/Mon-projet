<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Carte de fin — Réels & Stories</title>
<link rel="stylesheet" href="../charte/brand.css"><script src="../charte/coordonnees.js"></script>
<style>
  /* À placer sur les 3 DERNIÈRES SECONDES de chaque Réel / Story vidéo */
  .canvas { width: var(--reel-w); height: var(--reel-h); position: relative; overflow: hidden;
    background: linear-gradient(165deg, var(--bleu-iad) 0%, var(--bleu-iad) 55%, var(--bleu-vif) 100%);
    color: var(--blanc); display:flex; flex-direction:column; align-items:center; text-align:center; padding: 220px var(--marge) 0; }
  .halo { position:absolute; width:900px; height:900px; border-radius:50%; top:-300px; right:-400px;
    border: 3px solid var(--accent); opacity:.25; }
  .photo { width: 420px; height: 420px; border-radius: 50%; object-fit: cover;
    border: 10px solid var(--blanc); box-shadow: 0 0 0 6px var(--accent), 0 30px 60px rgba(0,0,0,.35); }
  .pre { margin-top: 80px; font-family: var(--font-signature); font-style: italic; font-size: 52px; color: var(--accent); }
  .nom { margin-top: 10px; font-family: var(--font-titre); font-weight: 900; font-size: 92px; text-transform: uppercase; line-height: 1; letter-spacing: 2px; }
  .titre { margin-top: 24px; font-size: 36px; font-weight: 500; opacity: .85; }
  .trait { width: 120px; height: 6px; background: var(--accent); margin: 60px auto; border-radius: 3px; }
  .ligne { font-family: var(--font-titre); font-weight: 700; font-size: 46px; margin: 14px 0; }
  .ligne.petit { font-size: 36px; font-weight: 500; opacity: .9; }
  .cta { margin-top: 70px; background: var(--accent); color: var(--bleu-iad); font-family: var(--font-titre);
    font-weight: 800; font-size: 40px; padding: 30px 60px; border-radius: 100px; text-transform: uppercase; letter-spacing: 1px; }
  .rsac { position:absolute; bottom: 150px; left: var(--marge); right: var(--marge); font-size: 20px; opacity: .55; }
  .bandeau { background: rgba(0,0,0,.18); }
</style></head>
<body><div class="canvas">
  <div class="halo"></div>
  <img class="photo" src="../assets/photo.jpg" alt="">
  <div class="pre">Votre projet, mon engagement</div>
  <div class="nom" data-champ="nom"></div>
  <div class="titre" data-champ="titre"></div>
  <div class="trait"></div>
  <div class="ligne" data-champ="telephone"></div>
  <div class="ligne petit" data-champ="email"></div>
  <div class="ligne petit" data-champ="secteur"></div>
  <div class="cta" data-champ="cta"></div>
  <div class="rsac" data-champ="rsac"></div>
  <div class="bandeau"><img class="logo-iad" src="../assets/logo-iad.png" alt=""><span data-champ="instagram"></span></div>
</div></body></html>
