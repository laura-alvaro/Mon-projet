<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Post annonce 4:5</title>
<link rel="stylesheet" href="../charte/brand.css"><script src="../charte/coordonnees.js"></script>
<style>
  body { padding:40px; }
  .canvas { width: var(--post-w); height: var(--post-h); position: relative; overflow: hidden; background: var(--bleu-iad); }
  .visuel { position:absolute; inset:0 0 360px 0; background: #b9c9d6 url('../assets/bien.jpg') center/cover; }
  .canvas > .vague { top: 790px; height: 200px; }
  .logo-haut { position:absolute; top: 60px; left: var(--marge); }
  .badge { position:absolute; top: 70px; right: var(--marge); background: var(--corail); color: var(--blanc);
    font-family: var(--font-titre); font-weight:800; font-style: italic; font-size: 38px; padding: 16px 40px; border-radius: 80px; }
  /* Variante VENDU : <div class="badge vendu">VENDU !</div> */
  .badge.vendu { background: var(--blanc); color: var(--corail); }
  .info { position:absolute; left: var(--marge); right: var(--marge); top: 930px; color: var(--blanc); }
  .ville { font-family: var(--font-signature); font-style: italic; font-size: 42px; color: var(--bleu-fonce); }
  .type { font-family: var(--font-titre); font-weight: 800; font-style: italic; font-size: 64px; line-height: 1.1; }
  .details { display:flex; gap: 36px; margin-top: 16px; font-size: 30px; font-weight: 600; }
  .prix { position:absolute; right: 0; top: 0; font-family: var(--font-titre); font-weight:800; font-size: 54px; color: var(--bleu-fonce); }
  .bandeau { background: var(--bleu-fonce); }
</style></head>
<body><div class="canvas">
  <div class="visuel"></div>
  <svg class="vague" viewBox="0 0 1080 220" preserveAspectRatio="none"><path d="M0,150 C260,60 560,20 1080,0 L1080,220 L0,220 Z" fill="#50B1E6"/></svg>
  <div class="logo-haut"><img class="logo-iad" src="../assets/logo-iad.png" alt=""></div>
  <div class="badge">À vendre</div>
  <div class="info">
    <div class="ville">Hussigny-Godbrange</div>
    <div class="type">Maison familiale</div>
    <div class="details"><span>120 m²</span><span>4 chambres</span><span>Jardin 500 m²</span></div>
    <div class="prix">320 000 €</div>
  </div>
  <div class="bandeau"><span data-champ="nom"></span><span class="contact" data-icone="whatsapp"><span data-champ="whatsapp"></span></span></div>
</div></body></html>
