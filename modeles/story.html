<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Story 9:16</title>
<link rel="stylesheet" href="../charte/brand.css"><script src="../charte/coordonnees.js"></script>
<style>
  body { padding:40px; }
  /* Zones de sécurité Instagram : 250px en haut, 340px en bas */
  .canvas { width: var(--reel-w); height: var(--reel-h); position: relative; overflow: hidden; background: var(--bleu-iad); color: var(--blanc); padding: 260px var(--marge) 0; }
  .canvas > .vague { top: 960px; height: 240px; }
  .canvas::after { content:''; position:absolute; left:0; right:0; top: 1198px; bottom: 0; background: var(--blanc); }
  .zone-sticker, .bandeau { z-index: 2; }
  .tete { display:flex; align-items:center; gap: 26px; position: relative; }
  .tete .photo { width: 130px; height: 130px; border-width: 5px; box-shadow: 0 0 0 4px var(--corail); }
  .tete .photo-vide { font-size: 44px; }
  .tete .nom { font-family: var(--font-titre); font-weight: 800; font-style: italic; font-size: 40px; }
  .tete .t { font-size: 26px; font-weight: 600; }
  .surtitre { margin-top: 120px; font-family: var(--font-signature); font-style: italic; font-size: 58px; color: var(--bleu-fonce); position: relative; }
  h1 { font-family: var(--font-titre); font-weight: 800; font-style: italic; font-size: 118px; line-height: 1.05; margin-top: 10px; position: relative; }
  .zone-sticker { position:absolute; left: var(--marge); right: var(--marge); top: 1200px; height: 320px; border: 4px dashed rgba(31,78,121,.3); border-radius: 40px;
    display:flex; align-items:center; justify-content:center; font-size: 30px; color: var(--gris-texte); }
  .bandeau { height: 340px; padding-bottom: 90px; }
  .bandeau .contact { font-size: 34px; }
</style></head>
<body><div class="canvas">
  <svg class="vague" viewBox="0 0 1080 220" preserveAspectRatio="none"><path d="M0,150 C260,60 560,20 1080,0 L1080,220 L0,220 Z" fill="#FFFFFF"/></svg>
  <div class="tete"><img class="photo" src="../assets/photo.jpg" alt=""><div><div class="nom" data-champ="nom"></div><div class="t" data-champ="secteur"></div></div></div>
  <div class="surtitre">Question du jour</div>
  <h1>Vendre ou louer votre bien ?</h1>
  <div class="zone-sticker">Zone sticker (sondage, question, lien…)</div>
  <div class="bandeau"><img class="logo-iad" src="../assets/logo-iad.png" alt=""><span class="contact" data-icone="whatsapp"><span data-champ="whatsapp"></span></span></div>
</div></body></html>
