<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Couverture</title>
<link rel="stylesheet" href="../../charte/brand.css"><script src="../../charte/coordonnees.js"></script>
<style>
  .canvas { width:1080px; height:1920px; position:relative; overflow:hidden; background: var(--bleu-iad); }
  .p { position:absolute; inset:0; background-size:cover; }
  .avant { background-image:url('photos/cuisine-brut.jpg'); background-position:center; clip-path: polygon(0 0,100% 0,100% 38%,0 62%); }
  .apres { background-image:url('photos/cuisine-projection.jpg'); background-position:center 70%; clip-path: polygon(0 62%,100% 38%,100% 100%,0 100%); }
  .trait { position:absolute; left:-50px; right:-50px; top:50%; height:14px; background:#fff; transform: rotate(-23.5deg); box-shadow:0 0 30px rgba(0,0,0,.3); }
  .logo { position:absolute; top:300px; left:70px; } .logo .logo-iad { height:96px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.5)); }
  .chip { position:absolute; top:312px; right:70px; background: var(--corail); color:#fff; font-family: var(--font-titre); font-weight:800; font-style:italic; font-size:36px; padding:12px 32px; border-radius:60px; }
  .lbl { position:absolute; font-family: var(--font-titre); font-weight:800; font-style:italic; font-size:44px; padding:12px 32px; border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.3); }
  .l1 { left:70px; top:560px; background:#fff; color: var(--bleu-fonce); }
  .l2 { right:70px; top:1240px; background: var(--corail); color:#fff; }
  .boite { position:absolute; left:70px; right:70px; top:1330px; background: var(--bleu-iad); border-radius:36px; padding:30px 44px; box-shadow:0 20px 50px rgba(0,0,0,.35); text-align:center; }
  .boite .s { font-family: var(--font-signature); font-style:italic; color:#fff; font-size:52px; }
  .boite h1 { font-family: var(--font-titre); font-weight:800; font-style:italic; color:#fff; font-size:88px; line-height:1; margin-top:4px; }
  .boite .i { font-family: var(--font-titre); font-weight:700; font-style:italic; color: var(--bleu-fonce); font-size:40px; margin-top:10px; }
  .nc { position:absolute; right:70px; top:1300px; font-size:20px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.8); }
</style></head>
<body><div class="canvas">
  <div class="p avant"></div><div class="p apres"></div><div class="trait"></div>
  <div class="logo"><img class="logo-iad" src="../../assets/logo-iad.png" alt=""></div><span class="chip">Exclusivité</span>
  <span class="lbl l1">Aujourd'hui</span><span class="lbl l2">Demain ?</span><span class="nc" style="top:1650px;right:auto;left:70px">Image de projection non contractuelle</span>
  <div class="boite"><div class="s">Une page blanche à</div><h1>Joudreville</h1><div class="i">Maison 95 m² · Terrain 440 m²</div></div>
</div></body></html>
