<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Couverture</title>
<link rel="stylesheet" href="../../charte/brand.css"><script src="../../charte/coordonnees.js"></script>
<style>
  /* Essentiel dans la zone grille 4:5 (y 285 → 1635) */
  .canvas { width:1080px; height:1920px; position:relative; overflow:hidden; background: var(--bleu-iad); }
  .vague { top: 1100px; height: 300px; } .blanc { position:absolute; left:0; right:0; top:1398px; bottom:0; background:#fff; }
  .logo { position:absolute; top:300px; left:70px; } .logo .logo-iad { height:96px; }
  .chip { position:absolute; top:312px; right:70px; background: var(--corail); color:#fff; font-family: var(--font-titre); font-weight:800; font-style:italic; font-size:36px; padding:12px 32px; border-radius:60px; }
  .cartes { position:absolute; top:450px; left:70px; right:70px; height:700px; }
  .c { position:absolute; border-radius:36px; border:8px solid #fff; box-shadow:0 24px 50px rgba(31,78,121,.35); background-size:cover; background-position:center; }
  .c1 { left:0; top:40px; width:470px; height:600px; background-image:url('photos/cinema.jpg'); transform: rotate(-4deg); }
  .c2 { right:0; top:0; width:470px; height:600px; background-image:url('photos/piscine.jpg'); transform: rotate(4deg); }
  .c3 { left:235px; top:160px; width:470px; height:560px; background-image:url('photos/studio-cuisine.jpg'); z-index:2; }
  .num { position:absolute; width:110px; height:110px; border-radius:50%; background: var(--corail); color:#fff; border:6px solid #fff; z-index:3;
    display:flex; align-items:center; justify-content:center; font-family: var(--font-titre); font-weight:800; font-style:italic; font-size:64px; }
  .txt { position:absolute; left:70px; right:70px; top:1260px; text-align:center; }
  h1 { font-family: var(--font-titre); font-weight:800; font-style:italic; color: var(--bleu-fonce); font-size:104px; line-height:1; }
  .sous { font-family: var(--font-signature); font-style:italic; color: var(--corail); font-size:58px; margin-top:14px; }
  .prix { display:inline-block; margin-top:18px; background: var(--bleu-iad); color:#fff; font-family: var(--font-titre); font-weight:800; font-size:58px; padding:8px 36px; border-radius:22px; }
  .contact { position:absolute; left:0; right:0; top:1720px; display:flex; justify-content:center; align-items:center; gap:16px; color: var(--bleu-fonce); font-weight:700; font-size:38px; }
  .contact .wa-icone { width:56px; height:56px; }
</style></head>
<body><div class="canvas">
  <svg class="vague" viewBox="0 0 1080 220" preserveAspectRatio="none"><path d="M0,170 C300,70 640,30 1080,10 L1080,222 L0,222 Z" fill="#fff"/></svg><div class="blanc"></div>
  <div class="logo"><img class="logo-iad" src="../../assets/logo-iad.png" alt=""></div><span class="chip">À vendre</span>
  <div class="cartes"><div class="c c1"></div><div class="c c2"></div><div class="c c3"></div>
    <div class="num" style="left:-10px;top:10px">1</div><div class="num" style="left:430px;top:130px">2</div><div class="num" style="right:-10px;top:-20px">3</div></div>
  <div class="txt"><h1>3 surprises</h1><div class="sous">dans cette maison 8 pièces</div><div class="prix">325 000 € FAI</div></div>
  <div class="contact" data-icone="whatsapp"><span>Laura ALVARO · 07 50 40 80 37</span></div>
</div></body></html>
